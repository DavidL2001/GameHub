<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
</head>
<body>
<h1>Dice Game 🎲</h1>

<p id="result">Roll the dice!</p>

<button id="rollBtn">Roll Dice</button>
<div id="achievementPopup" style="display:none; border:1px solid black; padding:10px;">
  <p id="achievementText"></p>
</div>

<h3>Leave your thoughts 💭</h3>
<label for="rating">Rating (1-5)</label>
<div id="starRating">
  <span data-value="1">★</span>
  <span data-value="2">★</span>
  <span data-value="3">★</span>
  <span data-value="4">★</span>
  <span data-value="5">★</span>
</div>
<br>
<textarea id="reviewText"></textarea>
<br>
<button id="reviewBtn">Submit Review</button>
<p id="reviewMessage"></p>
<ul id="reviewsList"></ul>

<script src="/scripts/dice.js"></script>  
</body>
</html>
