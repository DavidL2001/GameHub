<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <div id="navbar"></div>
    <section id="guess-number-container">
    <h1>Guess The Number 🎯</h1>

    <p>Guess a number between 1 and 100</p>

    <input type="number" id="guessInput" min="1" max="100" />
    <button id="guessBtn">Guess</button>
    <button id="resetBtn" style="display: none;">Play again!</button>

<p id="lastGuess"></p>
<p id="feedback"></p>
<p id="attempts"></p>

<div id="achievementPopup" style="display:none; border:1px solid black; padding:10px;">
  <p id="achievementText"></p>
</div>

<h3>Leave your thoughts 💭</h3>
<label for="rating">Rating (1-5)</label>
<div id="starRating">
  <span data-value="1">★</span>
  <span data-value="2">★</span>
  <span data-value="3">★</span>
  <span data-value="4">★</span>
  <span data-value="5">★</span>
</div>
<br>
<textarea id="reviewText"></textarea>
<br>
<button id="reviewBtn">Submit Review</button>
<p id="reviewMessage"></p>
<ul id="reviewsList"></ul>

</section>
<script src="scripts/loadNavbar.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./scripts/guessNumber.js"></script>
</body>
</html>
